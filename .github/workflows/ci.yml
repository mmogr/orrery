name: ci
on:
  pull_request:
  push:
    branches: [main]
  # the version pull request is opened by a token that wakes no workflow,
  # so its checks are asked for by hand: run this workflow on its branch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest       # the npm the release runs under, so a pull request meets it first
      - run: npm ci                  # runs prepare, so the emit to dist/ is checked too
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo:build
  changeset:
    # a change to src/ ships with its release note; docs, tests and CI alone need none
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD")
          notes=$(grep -E '^\.changeset/[^/]+\.md$' <<<"$changed" | grep -v '^\.changeset/README\.md$' || true)
          if grep -q '^src/' <<<"$changed" && [ -z "$notes" ]; then
            echo "::error::src/ changed without a changeset — run 'npx changeset' and say what changed"
            exit 1
          fi
