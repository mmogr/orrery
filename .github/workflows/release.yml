# The release ceremony: a note travels with each change (.changeset/), a
# standing "Version Packages" pull request gathers the notes into the
# changelog and the version, and merging it is the release — this workflow
# tags it, writes the GitHub release, and publishes to npm with provenance
# through npm's trusted publishing, so no token exists anywhere.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest       # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          createGithubReleases: false   # the step below owns the tag and the release
          commit: "The next version, gathered from its changesets"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: the tag and the release follow what npm now carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the version main carries — the changesets step has already bumped
          # the tree to the next one and moved HEAD onto its own branch, so
          # ask the push that woke us, not the file and not HEAD
          v="$(git show "$GITHUB_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          # a fresh publish takes the registry a while to admit to: 0.4.1 was
          # not there a minute after it was published, and this step gave up
          # in silence, green, with no tag and no release. So ask for five
          # minutes, and then say so in red: run again, the version is found,
          # and the release is made from this same push. Better this push than
          # a later one: for 0.4.1 every later push was refused the tag (403),
          # from the first that changed a workflow file onwards
          for i in $(seq 1 30); do
            npm view "@mmogr/orrery@$v" version >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "::error::$v is not on npm after five minutes, so it has no tag and no release. Run this again once npm has it."; exit 1; }
            sleep 10
          done
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released"; exit 0
          fi
          git show "$GITHUB_SHA:CHANGELOG.md" | awk -v h="## $v" '$0==h{p=1;next} /^## /{p=0} p' > notes.md
          # the tag goes on the commit that set this version, not on whatever push woke us
          at="$(git log "$GITHUB_SHA" -1 --format=%H -G"\"version\": \"$v\"" -- package.json)"
          gh release create "v$v" --target "${at:-$GITHUB_SHA}" --title "v$v" --notes-file notes.md
