# The release ceremony, kept to one gesture: the version in package.json is
# the release. Land a bump on main and this workflow verifies the package,
# tags that version at the commit and writes the GitHub release with
# generated notes; if the tag already exists it does nothing. Publishing to
# npm slots in at the end once the scope is claimed.
name: release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do"
          fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists != 'true'
        run: npm ci && npm run typecheck && npm test
      - if: steps.version.outputs.exists != 'true'
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
