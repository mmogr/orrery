# The release ceremony: a note travels with each change (.changeset/), a
# standing "Version Packages" pull request gathers the notes into the
# changelog and the version, and merging it is the release — this workflow
# tags it, writes the GitHub release, and publishes to npm with provenance
# through npm's trusted publishing, so no token exists anywhere.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest       # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          createGithubReleases: true
          commit: "The next version, gathered from its changesets"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
