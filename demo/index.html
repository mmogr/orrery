<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00000f">
<title>@mmogr/orrery — demo</title>
<style>
  :root {
    --bg: #00000f; --ink: #e8ecff; --muted: #7a86ad; --gold: #ffc837;
    --line: rgba(122, 134, 173, 0.22);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  main { max-width: 1000px; margin: 0 auto; padding: 40px 20px 60px; }
  header h1 { font-size: 0.95rem; font-weight: 500; letter-spacing: 0.06em; margin: 0; }
  header p  { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.05em; margin: 6px 0 0; }
  nav { display: flex; gap: 4px; margin: 26px 0 0; border-bottom: 1px solid var(--line); }
  nav button {
    background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px;
    color: var(--muted); font-family: var(--mono); font-size: 0.62rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px 9px; cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--ink); border-bottom-color: var(--gold); }
  #stage {
    display: block; width: 960px; height: 560px; max-width: 100%;
    margin: 18px auto 0; border: 1px solid var(--line); background: var(--bg);
  }
  #caption {
    color: var(--muted); font-size: 0.7rem; letter-spacing: 0.04em; line-height: 1.55;
    text-align: center; max-width: 760px; margin: 14px auto 0; min-height: 2.2em;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>@mmogr/orrery</h1>
    <p>the observatory's physics — four models, run live in this page</p>
  </header>
  <nav id="tabs">
    <button data-tab="0" class="on">Spectral sky</button>
    <button data-tab="1">Heat</button>
    <button data-tab="2">Kepler</button>
    <button data-tab="3">Terrain</button>
  </nav>
  <canvas id="stage"></canvas>
  <p id="caption"></p>
</main>
<script type="module" src="./out/main.js"></script>
</body>
</html>
